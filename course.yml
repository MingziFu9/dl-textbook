# ============================================================
# 课程配置：全书唯一需要手改的配置文件
# 改完后运行  python tools/course.py sync  ，会自动更新：
#   mkdocs.yml 的站点名和导航、首页课程信息与目录、缺少的章节骨架、
#   实验目录、术语表的章节小节、学习图谱的章节列表、附录编号
# 课件（tools/make_slides.py）、教案（tools/make_lesson_plan.py）、Word/PDF 版（tools/export_docx.py）
# 也从这里读取课程名、学时等信息
# ============================================================

title: 神经网络与深度学习                      # 书名
description: 面向成人教育人工智能技术应用专业（专科）的《神经网络与深度学习》教材，10 章 27 个 PyTorch 动手实验
audience: 成人教育（继续教育）人工智能技术应用专业专科学生，多为在职学习者
github_user: MingziFu9                # 网址 https://<github_user>.github.io/<repo>/
repo: dl-textbook            # GitHub 仓库名（用模板新建后改成本课的，如 ml-textbook）

credits: 3                            # 学分
hours: {theory: 36, lab: 18}          # 学时：理论 + 实验
semester: 3                           # 开课学期
exam: 开卷                            # 期末考核方式
labs_per_chapter: 3                   # 每章实验数；0 表示没有实验
lab_section: 本章实验                 # 实验部分的二级标题；导论用“在线体验”
lab_word: 实验                        # 每个实验的三级标题前缀（### 实验 N-M）；导论用“体验”
frontier_title: 前沿视窗              # 每章“前沿”小节的名称，导论用“身边的 AI”
certificates:                         # 对应的职业证书；没有证书的课程写成 certificates: []，导航里就不显示“证书考点对照”页
  - name: 人工智能训练师（三级）
    issuer: 人力资源和社会保障部、工业和信息化部，《人工智能训练师国家职业技能标准》（2021 年版）
  - name: 人工智能数据处理工程师（高级）
    issuer: 工业和信息化部教育与考试中心，《人工智能数据处理工程师》培训课程标准（试行版，2022）
  - name: Python 技术应用工程师（高级）
    issuer: 工业和信息化部教育与考试中心（未找到官方考纲，依据培训机构转述）
  - name: 人工智能应用工程师（高级）
    issuer: 工业和信息化部教育与考试中心（未找到官方考纲，依据培训机构转述）

# 章节：dir 是 docs/chapters/ 下的文件夹名（两位章号开头），short 用于学习图谱等窄处
# theory / lab 是本章学时；labs 可单独覆盖本章实验数；offline 可指定本章线下学时（不写则按 online_ratio 分）
chapters:
  - {dir: 01-neuron, title: "初识神经网络：从一个神经元说起", short: "初识神经网络", theory: 3, offline: 1, lab: 1, labs: 2}
  - {dir: 02-training, title: "训练的本质：损失函数与梯度下降", short: "损失与梯度下降", theory: 4, offline: 1, lab: 2}
  - {dir: 03-backprop, title: "反向传播：误差怎么往回传", short: "反向传播", theory: 3, offline: 1, lab: 1, labs: 2}
  - {dir: 04-generalization, title: "把模型训练好：过拟合与调优", short: "过拟合与调优", theory: 4, offline: 1, lab: 2}
  - {dir: 05-cnn, title: "卷积神经网络：为图像而生", short: "卷积神经网络", theory: 4, offline: 1, lab: 2}
  - {dir: 06-sequence, title: "序列模型：从 RNN 到 Transformer", short: "RNN 到 Transformer", theory: 4, offline: 1, lab: 2}
  - {dir: 07-image-transfer, title: "图像分类实战与迁移学习", short: "图像分类与迁移学习", theory: 3, offline: 1, lab: 2}
  - {dir: 08-text, title: "文本分类实战与预训练模型", short: "文本分类与预训练", theory: 4, offline: 1, lab: 2}
  - {dir: 09-generative, title: "生成模型：让网络学会“创作”", short: "生成模型", theory: 4, offline: 1, lab: 2}
  - {dir: 10-drl-project, title: "深度强化学习、伦理与综合项目", short: "强化学习与综合项目", theory: 3, offline: 1, lab: 2, labs: 2}

# 其他页面：追加在导航“常见问题”之后，如 extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]
extra_pages: [{file: mock-exam.md, title: 期末模拟卷}]

# 附录：docs/appendix/ 下的文件，按顺序自动编号为 A、B、C……（术语表固定为 glossary.md）
appendices:
  - {file: a-pytorch.md, title: PyTorch 速查}
  - {file: b-environment.md, title: 实验环境、数据与算力说明}
  - {file: glossary.md, title: 术语表}

# 教案默认设置（每章可在 lesson-plans/chNN.yml 里覆盖）
lesson_plan:
  online_ratio: 0.5                   # 线上学时占比（开放大学以线上为主，按实际改）
  teacher: "李春红"                         # 授课教师，留空则教案上留出填写位置
  school: ""                          # 学校名称，留空则不显示
