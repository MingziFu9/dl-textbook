# 第 8 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 8
chapter: 8
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出分词、词表、补齐、截断、词嵌入、词向量、余弦相似度、预训练语言模型、BERT 的含义
  - 解释独热编码的缺点，以及词向量为什么能表示“意思相近”
  skill:
  - 计算两个词向量的余弦相似度
  - 用 jieba 和 PyTorch 完成一个中文文本分类项目：分词、建词表、编号、训练 Embedding + LSTM 模型并评估
  - 比较从零训练、词袋模型、预训练模型微调几种做法的特点，为实际任务选择合适的方案
  quality:
  - 处理用户评论等文本数据时，注意保护个人信息
  - 理解“预训练 + 微调”带来的效率，合理选择技术方案
key_points:
- 文本怎么变成数字
- 案例实战：外卖评论情感分类
- 预训练语言模型：先读万卷书，再做小练习
- 示范例题
difficulties:
- point: 从文字到向量的四步
  solution: 拿一条外卖评论，在黑板上走一遍分词、建词表、编号补齐、词嵌入
- point: 一词多义与预训练模型
  solution: 用“这家的苹果很甜”和“苹果手机”对比，说明固定词向量的局限
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 95
    content: 学习网页教材第 8 章：8.1 文本怎么变成数字；8.2 案例实战；8.3 预训练语言模型；8.4 示范例题；8.5 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林在一家外卖平台的客服部门实习。平台每天收到上万条评论，其中有夸奖，也有投诉：“等了两个小时，饭都凉了”“送餐员态度很……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：文本预处理四步、词向量与余弦相似度、预训练与微调
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 从文字到向量的四步；一词多义与预训练模型。演示：词向量与余弦相似度
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 8-1 ★ 训练一个小词向量，看哪些词挨得近、实验 8-2 ★ 外卖评论情感分类、实验 8-3 ☆ 用中文预训练模型微调同一任务（待实测）（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：说明独热编码的两个缺点，以及词向量是怎样克服它们的。
- 简答题：用“先读万卷书，再做小练习”解释 BERT 的预训练和微调。
- 实操题：词向量“快” = (0.9, 0.2)，“及时” = (0.8, 0.4)，“慢” = (0.7, −0.6)。计算“快”与另外两个词的余弦相似度，并判断哪个词与“快”更相近。
- 实操题：修改实验 8-2，把最大长度 `MAXLEN` 从 40 改成 10，重新训练两个模型，测试准确率有什么变化？结合评论的长度说明原因。
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
