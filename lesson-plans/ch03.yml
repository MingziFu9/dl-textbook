# 第 3 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 3
chapter: 3
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出计算图、链式法则、反向传播、自动求导、梯度消失、梯度爆炸、优化器的含义
  - 解释反向传播怎样把误差从输出一层层往回分摊，为什么深层网络容易出现梯度消失
  skill:
  - 计算一个两步计算的导数和一个神经元的参数梯度，并用 PyTorch 的自动求导验证
  - 根据每层梯度的大小判断网络是否出现梯度消失，并选择合适的对策
  - 比较 SGD、动量、Adam 三种优化器的训练效果
  quality:
  - 体会“从结果往回找原因”的分析方法
  - 认识工程方法（初始化、批归一化）对解决实际问题的价值
key_points:
- 计算图：把计算画成流程图
- 链式法则：齿轮传动
- 自动求导：让 PyTorch 替你求梯度
- 深层网络的难题：梯度消失与梯度爆炸
difficulties:
- point: 链式法则与误差往回分摊
  solution: 先用齿轮比喻和两步计算 y = (2x + 1)²，再用“误差往回传”动画走一遍一个神经元的前向、反向、更新
- point: 梯度消失的成因
  solution: 让学生连乘 10 个 0.25，再展示实验 3-2 中 10 层 Sigmoid 网络各层梯度的数量级
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 50
    content: 学习网页教材第 3 章：3.1 计算图；3.2 链式法则；3.3 自动求导；3.4 深层网络的难题；3.5 优化器；3.6 示范例题；3.7 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：一家连锁超市的季度销售额比目标少了 100 万元。总部要找出问题出在哪里：总部的结果来自三个大区，大区的结果又来自各自的……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：链式法则、反向传播的直觉、自动求导、梯度消失与对策、优化器
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 链式法则与误差往回分摊；梯度消失的成因。演示：误差往回传：默认数值，再换成 Sigmoid
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 3-1 ★ 用自动求导求梯度，并和手算结果对照、实验 3-2 ☆ 深层网络里看梯度消失，再比一比三种优化器（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：用“从结果往回推、层层分摊”的思路，说明反向传播是怎样算出每个参数的梯度的。
- 简答题：什么是梯度消失？它是怎样产生的？请列出两种缓解方法。
- 实操题：设 L = (w·x + b − y)²，其中 x = 3、y = 10，初始 w = 1、b = 1。（1）手算 dL/dw 和 dL/db；（2）用 PyTorch 自动求导验证；（3）学习率 0.01，更新一步后损失是多少？
- 实操题：修改实验 3-2 的 `deep_net`，把层数从 10 改为 20，比较“ReLU + 何恺明初始化”和“ReLU + 批归一化”两个网络第 1 层的梯度和训练 2 轮的准确率，写出你的结论。
- 实验报告：实验 3-1、实验 3-2
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
