# 第 9 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 9
chapter: 9
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出判别模型、生成模型、自编码器、编码、潜在空间、生成对抗网络、生成器、判别器、扩散模型的含义
  - 解释自编码器为什么能降噪和做异常检测，GAN 的两个网络怎样互相比赛，扩散模型怎样从噪声中生成数据
  skill:
  - 用 PyTorch 实现自编码器和一个简单的 GAN，并完成训练
  - 根据 GAN 的两条损失曲线和生成的图片，判断训练是否正常
  - 说出深度伪造的风险和我国的相关规定，在使用生成式人工智能时遵守标识要求
  quality:
  - 认识生成技术的两面性，增强识别和防范深度伪造的意识
  - 使用生成内容时遵守标识规定
key_points:
- 判别与生成：认得出和画得出
- 自编码器：先压缩，再还原
- 生成对抗网络：造假者和鉴定师的比赛
- 扩散模型：一点点加噪声，再一点点去掉
difficulties:
- point: GAN 的对抗训练与损失曲线
  solution: 用“造假者和鉴定师”比喻，结合 9.5 节例题比较正常和异常的两组损失
- point: 扩散模型“加噪再去噪”的思路
  solution: 展示实验 9-3 中二维点从随机分布一步步变成笑脸的图
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 95
    content: 学习网页教材第 9 章：9.1 判别与生成；9.2 自编码器；9.3 生成对抗网络；9.4 扩散模型；9.5 示范例题；9.6 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小周在一家照相馆工作。最近，老顾客张阿姨拿来一张泛黄的老照片，是她父母年轻时的合影，上面布满了折痕和斑点。张阿姨问：“现……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：自编码器的结构与用途、GAN 的两个网络、扩散模型的思路
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: GAN 的对抗训练与损失曲线；扩散模型“加噪再去噪”的思路。演示：实验 9-1 还原与降噪对比图；实验 9-3 笑脸生成图
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 9-1 ★ 自编码器压缩与还原手写数字，并给图片去噪、实验 9-2 ★ 训练一个小 GAN 生成手写数字、实验 9-3 ☆ 扩散模型体验：二维点的“加噪与去噪”（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：用“造假者和鉴定师”的比喻说明 GAN 的训练过程，并说明为什么判别器太强反而不好。
- 简答题：用三步说明扩散模型怎样生成图片，并说明它怎样做到“按文字画画”。
- 实操题：实验 9-1 中，以手写数字还原误差的 95% 分位数（0.0179）为门槛，服装图片有 97.7% 被判为异常。如果把门槛提高到 99% 分位数，服装图片被判为异常的比例和手写数字被误判的比例会怎样变化？修改代码中的 `quantile(0.95)` 验证你的判断。
- 实操题：修改实验 9-2，把生成器和判别器的学习率都改成 0.002（原来的 10 倍），训练 10 轮，记录两条损失和生成的图片，与原来的结果比较，说明你的发现。
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
