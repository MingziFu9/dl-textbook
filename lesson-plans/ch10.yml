# 第 10 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 10
chapter: 10
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出智能体、环境、状态、动作、奖励、策略、Q 值、经验回放、目标网络的含义
  - 解释 DQN 为什么要用神经网络代替 Q 表，以及 ε-贪心、经验回放、目标网络的作用
  skill:
  - 运行并读懂一个 DQN 程序，根据得分曲线描述智能体的学习过程
  - 针对一个深度学习应用，识别偏见、隐私、深度伪造、安全、能耗等方面的风险，说出相关法规的要求
  - 以小组为单位设计一个深度学习项目方案，完成原型并参与互评
  quality:
  - 树立科技伦理和法治意识，了解我国人工智能相关法规
  - 在小组项目中分工协作，客观评价他人的方案
key_points:
- 强化学习回顾：智能体、环境、奖励
- 深度强化学习：用神经网络代替 Q 表
- 深度学习的伦理与安全
- 综合项目：设计并评审一个深度学习项目
difficulties:
- point: DQN 的三个关键做法
  solution: 结合实验 10-1 的得分曲线，说明经验回放和目标网络让训练更稳定
- point: 项目方案的风险评估
  solution: 用 10.5 节垃圾分类方案例题，带学生对照风险表逐条“挑毛病”
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 50
    content: 学习网页教材第 10 章：10.1 强化学习回顾；10.2 深度强化学习；10.3 深度学习的伦理与安全；10.4 综合项目；10.5 示范例题；10.6 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：2016 年 3 月，谷歌 DeepMind 公司的围棋程序 AlphaGo 以 4∶1 战胜了世界冠军李世石。围棋的变……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：深度强化学习的思路、伦理与安全风险、项目方案设计与评审
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: DQN 的三个关键做法；项目方案的风险评估。演示：实验 10-1 得分曲线；项目评分表
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 10-1 ★ 看 DQN 学会平衡小车、实验 10-2 ★ 小组综合项目：写方案、做原型、互评（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：说出 DQN 中经验回放和目标网络各自的作用。
- 简答题：任选一个深度学习应用（如人脸识别门禁、AI 招聘筛选、AI 换脸），分析它可能带来的两种伦理或安全风险，并提出应对措施。
- 实操题：某局游戏中，智能体在某个状态下向右推得到奖励 1，到达下一个状态。目标网络在下一个状态中算出的 Q 值为：向左 50、向右 48。折扣 γ = 0.99，游戏没有结束。计算 DQN 的学习目标值；如果这一步之后游戏结束了，目标值又是多少？
- 实操题：修改实验 10-1，把训练局数从 500 改成 300，再改成 800，记录“最近 20 局平均得分最高”的局数和分数、测试 10 局的平均得分，说明训练局数对结果的影响。
- 实验报告：实验 10-1、实验 10-2
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
