# 第 1 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 1
chapter: 1
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出神经元、权重、偏置、激活函数、隐藏层、前向传播的含义
  - 解释激活函数为什么必不可少，多加一个隐藏层为什么能画出弯曲的分界线
  skill:
  - 计算一个小网络在给定权重下的输出，算出一个全连接网络的参数个数
  - 运行一个现成的 PyTorch 程序，读懂网络结构的打印结果
  - 在网页动画中判断一组数据需要多大的网络才能分开
  quality:
  - 体会“复杂能力来自简单零件的组合”，养成拆解问题的思维习惯
  - 了解深度学习在身边的应用，树立用技术服务生活和工作的意识
key_points:
- 深度学习能做什么
- 从生物神经元到人工神经元
- 激活函数：为什么要“拐个弯”
- 多层感知机与前向传播
difficulties:
- point: 为什么必须有激活函数
  solution: 用 h = 2x + 1、y = 3h − 4 合并成 y = 6x − 1 的算式说明，再在网络游乐场里对比“不用激活函数”和 ReLU 的分界线
- point: 参数个数的计算
  solution: 从“一层就是表格乘法”入手，先算 nn.Linear(3, 4)，再算 784 → 128 → 64 → 10，最后用实验 1-2 打印的数核对
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 50
    content: 学习网页教材第 1 章：1.1 深度学习能做什么；1.2 从生物神经元到人工神经元；1.3 激活函数；1.4 多层感知机与前向传播；1.5 看懂网络的“形状”；1.6 示范例题；1.7 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林新买的手机有个功能：打开相册，点“人物”，几千张照片已经按人自动分好了组，连他十年前的毕业照里的自己也认了出来。他很……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：激活函数的作用、多层感知机的结构、参数个数计算
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 为什么必须有激活函数；参数个数的计算。演示：网络游乐场：圆圈数据分别用 1、2、3 个隐藏神经元
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 1-1 ★ 在网页动画里搭一个网络、实验 1-2 ★ 准备 PyTorch 环境，运行现成程序识别手写数字（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：用奶茶店“打分卡”的例子，说明人工神经元中权重、偏置、激活函数各自的作用。
- 简答题：为什么说“非线性必不可少”？请用一个具体的算式说明。
- 实操题：一个“3 → 2 → 1”的网络，隐藏层用 ReLU，输出层用 Sigmoid。h₁ 的权重为 (1, 0, −1)、偏置 0；h₂ 的权重为 (0, 1, 1)、偏置 −1；输出的权重为 (1, 1)、偏置 −0.5。输入 x = (2, 1, 1)。（1）手算网络输出；（2）仿照实验 1-2 第 5 步，用 PyTorch 验证。
- 实操题：在网络游乐场中，选“两个月牙”数据，找出能把准确率训练到 100% 的“最小网络”（隐藏层最少、神经元最少）。记录你的设置、准确率和参数个数，并说明你是怎样找到的。
- 实验报告：实验 1-1、实验 1-2
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
