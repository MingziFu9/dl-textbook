# 第 5 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 5
chapter: 5
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出卷积、卷积核、特征图、步幅、填充、通道、池化、卷积神经网络的含义
  - 解释全连接网络处理图像时的两个难题，以及卷积的局部连接、权值共享怎样解决它们
  skill:
  - 计算卷积层、池化层输出的形状和卷积层的参数个数
  - 用 PyTorch 的 `Conv2d`、`MaxPool2d` 搭建一个卷积神经网络，并完成训练和评估
  - 比较全连接网络和卷积神经网络在图片分类上的参数量和准确率，说出 LeNet、AlexNet、VGG、ResNet 各自的贡献
  quality:
  - 体会“针对问题特点设计方法”的工程思维
  - 计算尺寸和参数时认真细致，养成先估算再核对的习惯
key_points:
- 全连接网络搞不定图像的两个原因
- 卷积：一个小窗口在图上滑动
- 池化与特征图尺寸
- 经典结构：一步步变深
difficulties:
- point: 卷积的滑动计算与权值共享
  solution: 用卷积计算器一格一格演示 5×5 图上的乘加，再说明全图共用一个卷积核
- point: 特征图尺寸与参数个数
  solution: 先查表记住三种常用设置，再用 CNN 尺寸与参数计算器打开“尺寸出错的例子”找错
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 95
    content: 学习网页教材第 5 章：5.1 全连接网络搞不定图像的两个原因；5.2 卷积；5.3 池化与特征图尺寸；5.4 经典结构；5.5 用 PyTorch 搭一个 CNN；5.6 示范例题；5.7 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小张在一家物流公司做仓库管理。公司想用摄像头自动识别传送带上的包裹是纸箱、编织袋还是泡沫箱。小张想起刚学过的多层感知机，……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：卷积与池化、输出尺寸与参数计算、CNN 的结构规律
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 卷积的滑动计算与权值共享；特征图尺寸与参数个数。演示：卷积计算器；CNN 尺寸与参数计算器
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 5-1 ★ 用 Conv2d 给图片做边缘检测，看特征图、实验 5-2 ★ CIFAR-10 小图分类：全连接网络与 CNN 比一比、实验 5-3 ☆ 把 CNN 加深一层、加批归一化，看准确率变化（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：全连接网络处理照片有哪两个难题？卷积是怎样解决的？
- 简答题：用自己的话说明一个 CNN 中“越往后，特征图越小、通道越多”的原因。
- 实操题：输入 3×224×224 的照片，先经过 `nn.Conv2d(3, 64, kernel_size=7, stride=2, padding=3)`，再经过 `nn.MaxPool2d(2)`。分别算出两层输出的形状和卷积层的参数个数，并用 5.3 节的动画或 PyTorch 核对。
- 实操题：修改实验 5-2，把 CNN 第一个卷积层的卷积核个数从 16 改成 32（第二个卷积层的输入通道也要跟着改成 32），网络总参数变成多少？重新训练，测试准确率有什么变化？
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
