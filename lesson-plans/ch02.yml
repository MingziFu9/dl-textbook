# 第 2 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 2
chapter: 2
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出损失函数、梯度、梯度下降、学习率、批大小、轮次的含义
  - 解释梯度下降为什么能让损失越来越小，学习率太大、太小分别会怎样
  skill:
  - 计算一组预测的均方误差和交叉熵，手算梯度下降的几步更新
  - 编写PyTorch 的“训练五步”循环，从零训练一个识别手写数字的网络
  - 根据训练记录比较不同学习率、批大小的效果，选出合适的设置
  quality:
  - 养成“先定标准、再看改进”的量化思维
  - 做调参实验时如实记录，不挑选对自己有利的结果
key_points:
- 什么叫“好”：损失函数
- 怎么“变好”：梯度下降
- PyTorch 张量
- 训练五步
difficulties:
- point: 梯度下降的方向与学习率
  solution: 用“蒙眼下山”比喻和梯度下降动画，现场改学习率，看太小、合适、太大三种走法
- point: 训练五步的顺序与清梯度
  solution: 对照训练五步表格逐行讲代码，演示忘记 zero_grad() 时损失的异常变化
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 95
    content: 学习网页教材第 2 章：2.1 什么叫“好”；2.2 怎么“变好”；2.3 PyTorch 张量；2.4 训练五步；2.5 实战流程；2.6 示范例题；2.7 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：外卖平台给每一单都估一个“预计送达时间”。新上线的估时程序一开始很不准：明明 25 分钟就到了，它估 50 分钟；下雨天……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：均方误差与交叉熵、梯度下降与学习率、训练五步
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 梯度下降的方向与学习率；训练五步的顺序与清梯度。演示：梯度下降下山：学习率 0.1、0.9、1.05 对比
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 2-1 ★ 用梯度下降拟合一条直线、实验 2-2 ★ 训练五步：多层感知机识别手写数字、实验 2-3 ☆ 改学习率和批大小（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：用“蒙眼下山”的比喻解释梯度下降，并说明学习率太大和太小各会出现什么现象。
- 简答题：写出 PyTorch 训练五步的代码，并说明每一步的作用。
- 实操题：设损失函数 L(w) = (w − 5)²，梯度为 2(w − 5)。从 w = 1 出发，学习率 0.25，手算三步梯度下降，写出每一步的 w 和损失。再用 PyTorch 验证（提示：仿照实验 2-1，用 `requires_grad=True` 和 `backward()`）。
- 实操题：修改实验 2-2：把优化器的学习率改为 0.01，训练轮数改为 10 轮，记录每轮的测试准确率。和原来的设置（学习率 0.1、5 轮）相比，哪个最终准确率更高？哪个更省时间？
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
