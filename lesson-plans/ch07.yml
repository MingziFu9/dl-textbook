# 第 7 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 7
chapter: 7
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出图像分类、目标检测、图像分割的区别，以及迁移学习、预训练模型、冻结、微调的含义
  skill:
  - 按“收数据—划分—训练—评估—保存”的流程完成一个图像分类项目
  - 用 PyTorch 加载预训练的 ResNet18，实现冻结训练和解冻微调
  - 根据混淆矩阵计算准确率、精确率、召回率，找出模型最常认错的类别
  - 对认错的图片进行归类，提出有针对性的改进办法
  quality:
  - 树立“站在前人肩膀上”的开放协作意识，使用预训练模型时遵守许可
  - 养成从错误案例中找原因、写报告的职业习惯
key_points:
- 计算机视觉的三类任务
- 一个图像分类项目的完整流程
- 迁移学习：借用别人训练好的模型
- 评估指标：不只看准确率
difficulties:
- point: 冻结与微调的选择
  solution: 用“冻结几层好”动画看可训练参数与准确率的变化，再对照数据量与做法的对应表
- point: 精确率与召回率的区别
  solution: 用水果分拣例题，在混淆矩阵上分别按列、按行圈出计算范围
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 50
    content: 学习网页教材第 7 章：7.1 计算机视觉的三类任务；7.2 一个图像分类项目的完整流程；7.3 迁移学习；7.4 评估指标；7.5 示范例题；7.6 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：老陈在山东经营一个果园，种了苹果、梨和桃。每到采摘季，他都要雇人把混在一起的水果分拣开。他听说可以用摄像头加人工智能自动……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：图像分类项目流程、迁移学习、混淆矩阵与精确率召回率
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 冻结与微调的选择；精确率与召回率的区别。演示：冻结几层好
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 7-1 ★ 10 类图片分类完整项目、实验 7-2 ★ 迁移学习：用预训练 ResNet18 微调，和从零训练比、实验 7-3 ☆ 分析认错的图片，写错误案例报告（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：用“会骑自行车学电动车”的比喻解释迁移学习，并说明冻结和微调的区别。
- 简答题：一个图像分类项目包含哪些步骤？举出其中两步的常见错误。
- 实操题：根据实验 7-3 的混淆矩阵（7.4.1 节的图），计算“教堂”的精确率和召回率。（提示：“教堂”这一行是 0、0、1、2、395、1、1、4、1、4；“教堂”这一列是 1、1、0、2、395、1、11、7、4、7）
- 实操题：修改实验 7-2，只解冻 `layer4`（ResNet18 最后一组卷积）和 `fc`，其余保持冻结，微调 3 轮。记录要训练的参数个数和测试准确率，与解冻全部比较，说明你的发现。
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
