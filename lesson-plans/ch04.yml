# 第 4 章教案底稿：线上自学理论 + 线上实验，线下 1 学时集中讲重点难点。改好后运行 python tools/make_lesson_plan.py build 4
chapter: 4
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出泛化、过拟合、欠拟合、验证集、正则化、Dropout、权重衰减、数据增强、早停的含义
  - 解释为什么要把数据分成训练集、验证集和测试集，各自的用途是什么
  skill:
  - 根据训练曲线诊断模型是欠拟合、过拟合、学习率太大还是正常，并给出改进办法
  - 在 PyTorch 中使用 Dropout、权重衰减、数据增强和早停
  - 按合理的顺序设计一组调参实验，并用记录表选出最好的设置
  quality:
  - 树立“用数据说话、不自欺”的科学态度：调参只看验证集
  - 养成每次只改一处、完整记录的实验习惯
key_points:
- 训练集、验证集、测试集：模型到底学得怎么样
- 过拟合与欠拟合：读懂训练曲线
- 正则化：Dropout 与权重衰减
- 数据增强与早停
difficulties:
- point: 区分验证集和测试集的用途
  solution: 用“模拟考与正式考试”的比喻，并举出“用测试集调参”导致成绩虚高的例子
- point: 从训练曲线诊断问题
  solution: 用训练曲线诊断器逐一辨认四组真实曲线，再让学生诊断 4.6 节例题
process:
- phase: 课前（线上）
  steps:
  - name: 线上自学
    minutes: 95
    content: 学习网页教材第 4 章：4.1 训练集、验证集、测试集；4.2 过拟合与欠拟合；4.3 正则化；4.4 数据增强与早停；4.5 调参的基本顺序；4.6 示范例题；4.7 前沿视窗；操作本章交互动画，完成每节的“算一算”
    teacher: 在学习平台发布学习任务单和预习问题，查看学习进度
    student: 阅读教材、观看课件、操作动画，在讨论区提出疑问
    intent: 理论内容以线上自学为主，线下课集中解决重点难点
  - name: 线上自测
    minutes: 20
    content: 完成课后练习中的单选、多选、判断题（网页在线作答）
    teacher: 统计错误率高的题目，作为线下课讲评重点
    student: 在线作答，查看解析，记下不懂的题
    intent: 暴露问题，让线下课有的放矢
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小王准备考驾照科目一。他把题库里的 1000 道题刷了一遍又一遍，到后来每道题的答案都能脱口而出，模拟练习次次满分。可是……
    teacher: 回顾情景导入，点出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 本章重点：三种数据集、过拟合与欠拟合、四种正则化方法、调参顺序
    teacher: 结合线上自测的错题，讲清重点概念，带学生做一遍示范例题
    student: 听讲、跟着计算、提问
    intent: 集中突破重点
  - name: 难点突破与演示
    minutes: 10
    content: 区分验证集和测试集的用途；从训练曲线诊断问题。演示：训练曲线诊断器：四组真实曲线
    teacher: 按“教学难点”中的方法演示和讲解
    student: 观察演示、动手操作、回答提问
    intent: 化抽象为直观，突破难点
  - name: 课堂练习
    minutes: 10
    content: 从课后练习中选 3～5 道题当堂作答并讲评
    teacher: 组织作答，讲评错误率高的题
    student: 作答并说出理由
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，布置实验和作业，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 90
    content: 实验 4-1 ★ 故意制造过拟合：读懂损失曲线、实验 4-2 ★ 加 Dropout、权重衰减、数据增强和早停，比一比、实验 4-3 ☆ 小网格调参，写一份调参记录（★ 必做，☆ 选做）
    teacher: 发布实验任务，在讨论区答疑，收集常见错误
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手验证本章原理，形成技能
  - name: 课后巩固
    minutes: 20
    content: 完成简答题和实操题，错题点“回看”复习对应小节
    teacher: 批改作业和实验报告
    student: 完成作业
    intent: 巩固知识
homework:
- 简答题：为什么在训练集和测试集之外，还需要一个验证集？如果直接用测试集来调参，会有什么问题？
- 简答题：用“项目组开会”的比喻解释 Dropout 为什么能减轻过拟合，并说明使用时要注意什么。
- 实操题：某次训练的验证损失为：第 1～10 轮依次是 0.90、0.62、0.50、0.45、0.44、0.46、0.43、0.47、0.49、0.52。耐心为 2 轮的早停会在第几轮停下？耐心为 3 轮呢？两种情况各使用哪一轮的参数？
- 实操题：修改实验 4-2：把数据增强改为“随机旋转 ±20 度、平移最多 20%”，测试准确率比 ±10 度、10% 时高还是低？再试一次“随机旋转 ±180 度”，结果如何？根据结果说明“增强要合理”的含义。
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
