<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNN 与 LSTM 逐步展开</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  .wrap { overflow-x:auto; }
  svg { display:block; }
  .sl { display:grid; grid-template-columns:10em 1fr 3em; gap:6px; align-items:center; font-size:13px; }
  .eq { font-size:13.5px; line-height:1.9; }
  .lg span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 3px 0 10px; vertical-align:middle; }
</style>
</head>
<body>
<h1>RNN 与 LSTM 逐步展开：读到后面，还记得开头吗？</h1>
<div class="sub">判断一条短信是不是垃圾短信。为了看得清，记忆只有 1 维：“垃圾嫌疑”，正数偏垃圾、负数偏正常。词的含义由编者手工设定，没列出的词按中性词处理。</div>

<div class="row"><button id="mR" class="on">简单 RNN</button><button id="mL">LSTM</button></div>
<div class="row"><input type="text" id="txt" value="恭喜 您 中奖 了 请 点击 链接 领取" aria-label="用空格分好词的短信"></div>
<div class="row ex" id="ex"></div>
<div class="sl" id="slR"><span>RNN 记忆系数 u</span><input type="range" id="u" min="0.1" max="1.2" step="0.05" value="0.5"><b id="uv"></b></div>
<div class="sl" id="slL" hidden><span>遗忘门基准 f₀</span><input type="range" id="fb" min="0.3" max="1" step="0.01" value="0.95"><b id="fv"></b></div>
<div class="row"><button class="main" id="step">读下一个词 ▶</button><button id="all">一口气读完</button><button id="reset">从头读</button></div>

<div class="wrap"><svg id="chain" height="230"></svg></div>
<div class="box eq" id="eq"></div>
<div class="box">
  <h2>开头的词对最后的判断还有多大影响？（梯度）</h2>
  <div class="wrap"><svg id="grad" height="120"></svg></div>
  <div class="eq" id="geq"></div>
</div>

<script>
(function () {
  // 每个词：[垃圾倾向 s（−1～1），重要程度 a（0～1）]；没列出的词是中性词 [0, 0.05]
  var E = { "中奖":[1,1], "免费":[0.8,1], "领取":[0.7,0.8], "点击":[0.6,0.8], "链接":[0.5,0.7], "回复":[0.4,0.6], "恭喜":[0.5,0.6], "奖金":[0.9,1],
            "妈妈":[-0.7,0.8], "晚上":[-0.4,0.5], "吃饭":[-0.6,0.7], "开会":[-0.6,0.7], "回家":[-0.5,0.6], "谢谢":[-0.4,0.5], "作业":[-0.6,0.7] };
  var EX = ["恭喜 您 中奖 了 请 点击 链接 领取",
            "中奖 了 这 是 上次 说 的 那 件 事 你 有空 再 看 一下 吧",
            "妈妈 说 晚上 回家 吃饭"];
  var mode = "R", toks, S, t, F, I, G;
  function wv(w) { return E[w] || [0, 0.05]; }
  function run() {
    var u = +document.getElementById("u").value, f0 = +document.getElementById("fb").value;
    S = [0]; F = []; I = []; G = [];
    toks.forEach(function (w, k) {
      var x = wv(w), prev = S[k];
      if (mode === "R") S.push(Math.tanh(1.5 * x[0] + u * prev));
      else {
        var f = f0 * (1 - 0.5 * x[1]), i = x[1], g = Math.tanh(2 * x[0]);   // 遗忘门、输入门、候选记忆
        F.push(f); I.push(i); G.push(g); S.push(f * prev + i * g);           // 细胞状态 c
      }
    });
  }
  function load() { toks = document.getElementById("txt").value.trim().split(/\s+/).filter(Boolean); t = 0; run(); draw(); }
  function sig(z) { return 1 / (1 + Math.exp(-z)); }
  function out(k) { return mode === "R" ? S[k] : Math.tanh(S[k]); }      // LSTM：h = o · tanh(c)，这里输出门 o 固定为 1
  function bar(v, x0, y0, sc, col) { var h = Math.min(Math.abs(v), 1.6) * sc; return '<rect x="' + x0 + '" y="' + (v >= 0 ? y0 - h : y0) + '" width="14" height="' + Math.max(h, 0.5) + '" fill="' + col + '"/>'; }
  function draw() {
    var u = +document.getElementById("u").value, f0 = +document.getElementById("fb").value;
    document.getElementById("uv").textContent = u.toFixed(2); document.getElementById("fv").textContent = f0.toFixed(2);
    var n = toks.length, cw = 70, W = Math.max(560, (n + 1) * cw + 120), s = "";
    toks.forEach(function (w, k) {
      var x = 50 + k * cw, done = k < t, cur = k === t - 1, cx = x + (cw - 18) / 2;
      s += '<rect x="' + x + '" y="50" width="' + (cw - 18) + '" height="120" rx="8" fill="' + (cur ? "#e8eaf6" : "#fff") + '" stroke="' + (done ? "#3f51b5" : "#cfd8dc") + '" stroke-width="' + (cur ? 2 : 1) + '"/>';
      s += '<text x="' + cx + '" y="200" font-size="14" text-anchor="middle" fill="' + (done ? "#263238" : "#b0bec5") + '">' + w + "</text>";
      s += '<line x1="' + (x - 17) + '" y1="110" x2="' + (x - 1) + '" y2="110" stroke="' + (done ? "#3f51b5" : "#cfd8dc") + '" marker-end="url(#a)"/>';
      s += '<text x="' + (x + 4) + '" y="64" font-size="10" fill="#78909c">' + (mode === "R" ? "RNN" : "LSTM") + "</text>";
      s += '<line x1="' + (x + 2) + '" y1="110" x2="' + (x + cw - 20) + '" y2="110" stroke="#eceff1"/>';
      if (done) {
        var v = S[k + 1];
        s += bar(v, cx - 7, 110, 34, v >= 0 ? "#e53935" : "#43a047");
        s += '<text x="' + cx + '" y="' + (v >= 0 ? 160 : 76) + '" font-size="10" text-anchor="middle" fill="#3f51b5">' + v.toFixed(2) + "</text>";
        if (mode === "L") s += '<text x="' + cx + '" y="218" font-size="9.5" text-anchor="middle" fill="#78909c">f ' + F[k].toFixed(2) + " · i " + I[k].toFixed(2) + "</text>";
      }
    });
    if (t === n && n) {
      var p = sig(4 * out(n)), x2 = 50 + n * cw;
      s += '<line x1="' + (x2 - 17) + '" y1="110" x2="' + (x2 - 1) + '" y2="110" stroke="#3f51b5" marker-end="url(#a)"/><rect x="' + x2 + '" y="80" width="104" height="58" rx="8" fill="' + (p > 0.5 ? "#ffebee" : "#e8f5e9") + '" stroke="#90a4ae"/>' +
        '<text x="' + (x2 + 52) + '" y="102" font-size="12" text-anchor="middle">分类层</text><text x="' + (x2 + 52) + '" y="124" font-size="13" text-anchor="middle" font-weight="bold" fill="' + (p > 0.5 ? "#c62828" : "#2e7d32") + '">' + (Math.abs(p - 0.5) < 0.05 ? "说不准" : p > 0.5 ? "垃圾" : "正常") + " " + (p * 100).toFixed(0) + "%</text>";
    }
    s += '<text x="50" y="30" font-size="12" fill="#78909c">' + (mode === "R" ? "柱子是隐藏状态 h（红：偏垃圾，绿：偏正常）" : "柱子是记忆细胞 c（红：偏垃圾，绿：偏正常）；下方小字是遗忘门 f 和输入门 i") + "</text>";
    var svg = document.getElementById("chain"); svg.setAttribute("width", W);
    svg.innerHTML = '<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#90a4ae"/></marker></defs>' + s;
    var e = document.getElementById("eq");
    if (t === 0) e.innerHTML = (mode === "R" ? "h₀" : "c₀") + " 初始为 0。点“读下一个词”开始。";
    else {
      var x = wv(toks[t - 1]), nm = "“<b>" + toks[t - 1] + "</b>”（垃圾倾向 " + x[0] + "，重要程度 " + x[1] + (E[toks[t - 1]] ? "" : "，中性词") + "）";
      e.innerHTML = mode === "R" ?
        "第 " + t + " 步读入" + nm + "<br>h" + t + " = tanh(1.5 × " + x[0] + " + " + u.toFixed(2) + " × " + S[t - 1].toFixed(2) + ") = <b>" + S[t].toFixed(2) + "</b>" +
        "<br>简单 RNN 每一步都把旧记忆乘上 u 再和新词混在一起，没有选择。" :
        "第 " + t + " 步读入" + nm +
        "<br>遗忘门 f = " + f0.toFixed(2) + " × (1 − 0.5 × " + x[1] + ") = " + F[t - 1].toFixed(2) + "：旧记忆保留多少；输入门 i = " + I[t - 1].toFixed(2) + "：新内容写入多少；候选记忆 g = tanh(2 × " + x[0] + ") = " + G[t - 1].toFixed(2) +
        "<br>c" + t + " = f × c" + (t - 1) + " + i × g = " + F[t - 1].toFixed(2) + " × " + S[t - 1].toFixed(2) + " + " + I[t - 1].toFixed(2) + " × " + G[t - 1].toFixed(2) + " = <b>" + S[t].toFixed(2) + "</b>" +
        "<br>中性词的输入门很小、遗忘门接近 1：几乎不写入、也几乎不忘，记忆原样传下去。（输出门 o 这里固定为 1，h = tanh(c)）";
    }
    // 梯度：RNN 每往回一步乘 u·(1 − h²)；LSTM 沿记忆细胞往回每一步乘 f
    var g = [1], Gs = document.getElementById("grad"), gs = "", gw = Math.max(560, n * 46 + 60);
    for (var k = n; k > 1; k--) g.unshift(g[0] * (mode === "R" ? u * (1 - S[k] * S[k]) : F[k - 1]));
    Gs.setAttribute("width", gw);
    toks.forEach(function (w, k) {
      var v = g[k], lg = Math.max(0, 1 + Math.log10(Math.max(v, 1e-12)) / 12), x = 30 + k * 46, h = lg * 70;
      gs += '<rect x="' + x + '" y="' + (80 - h) + '" width="30" height="' + Math.max(h, 1) + '" fill="' + (v > 0.1 ? "#3f51b5" : v > 0.001 ? "#7986cb" : "#c5cae9") + '"/>' +
        '<text x="' + (x + 15) + '" y="96" font-size="11" text-anchor="middle">' + w + '</text><text x="' + (x + 15) + '" y="112" font-size="9.5" text-anchor="middle" fill="#78909c">' + (v >= 0.01 ? v.toFixed(2) : v.toExponential(0)) + "</text>";
    });
    Gs.innerHTML = gs;
    document.getElementById("geq").innerHTML = "柱子按对数画出。" + (mode === "R" ? "简单 RNN 往回每过一步乘 u × (1 − h²)，不超过 u。" : "LSTM 沿记忆细胞往回每过一步只乘遗忘门 f，f 接近 1 时几乎不衰减。") +
      (n > 1 ? "第 1 个词“" + toks[0] + "”的影响还剩 <b>" + (g[0] >= 0.01 ? g[0].toFixed(3) : g[0].toExponential(1)) + "</b>。" : "") +
      (mode === "R" ? "读第二个例句，再切到 LSTM 比较。" : "把遗忘门基准调到 0.5，LSTM 也会很快忘掉开头。");
    document.getElementById("step").disabled = t >= n;
  }
  document.getElementById("ex").innerHTML = "<span class='lbl'>试试：</span>" + EX.map(function (e, i) { return "<button data-i='" + i + "'>" + ["中奖通知", "开头“中奖” + 一长串中性词", "家人短信"][i] + "</button>"; }).join("");
  document.querySelectorAll("#ex button").forEach(function (b) { b.onclick = function () { document.getElementById("txt").value = EX[+b.dataset.i]; load(); }; });
  function setMode(m) {
    mode = m; document.getElementById("mR").classList.toggle("on", m === "R"); document.getElementById("mL").classList.toggle("on", m === "L");
    document.getElementById("slR").hidden = m !== "R"; document.getElementById("slL").hidden = m !== "L";
    var keep = t; run(); t = Math.min(keep, toks.length); draw();
  }
  document.getElementById("mR").onclick = function () { setMode("R"); };
  document.getElementById("mL").onclick = function () { setMode("L"); };
  document.getElementById("step").onclick = function () { if (t < toks.length) t++; draw(); };
  document.getElementById("all").onclick = function () { t = toks.length; draw(); };
  document.getElementById("reset").onclick = function () { t = 0; draw(); };
  document.getElementById("u").oninput = function () { run(); draw(); };
  document.getElementById("fb").oninput = function () { run(); draw(); };
  document.getElementById("txt").onchange = load;
  load();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
