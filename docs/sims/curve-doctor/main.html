<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练曲线诊断器</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.charts { max-width:760px; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
@media (max-width:620px) { .charts { grid-template-columns:1fr; } }
.charts svg { width:100%; height:auto; border:1px solid var(--line); border-radius:8px; }
.legend { font-size:12px; color:var(--muted); }
.legend i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin:0 4px 0 10px; }
.opts button { margin:3px 4px 3px 0; }
.opts button.right { background:var(--pos); border-color:var(--pos); color:#fff; }
.opts button.wrong { background:var(--neg); border-color:var(--neg); color:#fff; }
</style>
</head>
<body>
<h1>训练曲线诊断器</h1>
<div class="sub">下面是花卉网络在四种不同设置下真实训练出来的曲线。看图判断它是哪种情况，点选你的诊断。</div>
<div class="row ex"><span class="lbl">病例：</span><span id="cases"></span></div>
<div class="legend"><i style="background:#3f51b5"></i>训练集 <i style="background:#ef6c00"></i>验证集</div>
<div class="charts"><svg id="c1" viewBox="0 0 320 200"></svg><svg id="c2" viewBox="0 0 320 200"></svg></div>
<div class="row opts" id="opts"></div>
<div class="msg" id="msg"></div>
<div class="note">数据来源：通用版（Keras 3.15.1）在随书 750 张花卉照片上的实际训练记录，固定随机种子 42，与《人工智能开发框架技术》实验 5-3、6-1、6-2 的设置相同。</div>
<script>

747, 1.566, 1.5576, 1.5485, 1.5387, 1.528, 1.5157, 1.503, 1.4886, 1.4738, 1.4599, 1.443, 1.4275, 1.4104, 1.3942, 1.3798, 1.3621, 1.3464, 1.3315, 1.3158, 1.2989, 1.2848, 1.2704, 1.2553, 1.2455], "val_loss": [1.5977, 1.5947, 1.5875, 1.5833, 1.575, 1.5667, 1.5581, 1.5487, 1.5387, 1.528, 1.5148, 1.5041, 1.4917, 1.4779, 1.4639, 1.4479, 1.4334, 1.4174, 1.4068, 1.3907, 1.3737, 1.3642, 1.348, 1.3338, 1.3248, 1.3064, 1.2976, 1.2852, 1.2766, 1.2648], "acc": [0.2083, 0.24, 0.2417, 0.2717, 0.2933, 0.3267, 0.34, 0.345, 0.3667, 0.3617, 0.3967, 0.4017, 0.4333, 0.445, 0.455, 0.4617, 0.4867, 0.4917, 0.5017, 0.5033, 0.5217, 0.5283, 0.5267, 0.5283, 0.5417, 0.54, 0.5533, 0.5417, 0.5567, 0.5317], "val_acc": [0.24, 0.2667, 0.2867, 0.3067, 0.32, 0.3333, 0.34, 0.3133, 0.3467, 0.3533, 0.3667, 0.3667, 0.36, 0.3733, 0.4, 0.4067, 0.4267, 0.44, 0.42, 0.44, 0.44, 0.4533, 0.4467, 0.46, 0.4733, 0.4867, 0.4667, 0.4867, 0.48, 0.4933]}, "diverge": {"loss": [308.089, 1.6207, 1.6145, 1.6169, 1.6125, 1.6163, 1.6129, 1.6135, 1.6152, 1.6181, 1.6177, 1.6162, 1.6209, 1.614, 1.615], "val_loss": [1.6115, 1.6214, 1.6153, 1.6186, 1.6142, 1.6171, 1.6156, 1.6154, 1.6192, 1.6194, 1.6135, 1.616, 1.6203, 1.6175, 1.6132], "acc": [0.2233, 0.185, 0.1983, 0.195, 0.1883, 0.1767, 0.1917, 0.1967, 0.2133, 0.1933, 0.1783, 0.19, 0.1783, 0.205, 0.2], "val_acc": [0.18, 0.1933, 0.18, 0.16, 0.2133, 0.18, 0.16, 0.18, 0.16, 0.18, 0.16, 0.18, 0.16, 0.18, 0.18]}};
  var CASES = [
    { key: "underfit", ans: 0, why: "学得不够（欠拟合）：训练损失一直很高、下降得很慢，训练准确率和验证准确率都低，两条线挨得很近。这是学习率 0.00001 的结果，步子太小，30 轮还没学会。药方：调大学习率、多训练几轮，或者把网络加大。" },
    { key: "overfit", ans: 1, why: "死记硬背（过拟合）：训练损失一路降到接近 0、训练准确率接近 100%；验证损失降到第 7 轮左右后反而上升，验证准确率停在五成多。两条线越分越开。药方：早停、数据增强、Dropout，或者找更多数据。" },
    { key: "diverge", ans: 2, why: "训练炸了：第 1 轮训练损失高达 308（图中已截断），之后停在 1.61 附近不动，准确率在 20% 上下，等于瞎猜。这是学习率 0.1 的结果。药方：把学习率调小，比如 0.001。" },
    { key: "better", ans: 3, why: "比较健康：用了数据增强和 Dropout。训练准确率涨得慢一些，验证准确率比“死记硬背”那组高（最高约 0.65），两条线的差距明显变小。还有提升空间，第 7 章用迁移学习会更好。" }
  ];
  var LABELS = ["学得不够（欠拟合）", "死记硬背（过拟合）", "训练炸了（学习率太大）", "比较健康"];
  var $ = function (id) { return document.getElementById(id); }, cur = 0;
  function chart(svg, a, b, title, ymax) {
    var n = a.length, X = function (i) { return 34 + i / Math.max(1, n - 1) * 276; }, Y = function (v) { return 180 - Math.min(v, ymax) / ymax * 150; };
    var h = '<text x="160" y="16" text-anchor="middle" font-size="12" fill="#263238">' + title + '</text>';
    for (var k = 0; k <= 4; k++) { var v = ymax * k / 4, y = Y(v); h += '<line x1="34" x2="310" y1="' + y + '" y2="' + y + '" stroke="#eceff1"/><text x="30" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#78909c">' + (+v.toFixed(2)) + '</text>'; }
    h += '<text x="310" y="196" font-size="10" text-anchor="end" fill="#78909c">轮次（共 ' + n + ' 轮）</text>';
    [[a, "#3f51b5"], [b, "#ef6c00"]].forEach(function (s) {
      h += '<polyline fill="none" stroke="' + s[1] + '" stroke-width="2" points="' + s[0].map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ") + '"/>';
    });
    svg.innerHTML = h;
  }
  function show(i) {
    cur = i; var c = CASES[i], d = D[c.key];
    chart($("c1"), d.loss, d.val_loss, "损失 loss（越低越好）", 2.5);
    chart($("c2"), d.acc, d.val_acc, "准确率 accuracy（越高越好）", 1);
    document.querySelectorAll("#cases button").forEach(function (b, k) { b.classList.toggle("on", k === i); });
    $("opts").innerHTML = LABELS.map(function (l, k) { return '<button data-k="' + k + '">' + l + "</button>"; }).join("");
    $("msg").innerHTML = "你的诊断是？";
    document.querySelectorAll("#opts button").forEach(function (b) { b.onclick = function () {
      var k = +b.dataset.k, ok = k === c.ans;
      b.classList.add(ok ? "right" : "wrong");
      if (ok) document.querySelectorAll("#opts button").forEach(function (x) { x.disabled = x !== b; });
      $("msg").innerHTML = ok ? '<b class="ok">诊断正确。</b>' + c.why : '<b class="bad">再看看。</b>' + hint(k);
    }; });
  }
  function hint(k) {
    return ["欠拟合的特点是训练集上也学不好。这张图训练集上的表现怎么样？",
            "过拟合的特点是训练集越来越好、验证集却不跟着变好，两条线越分越开。",
            "学习率太大时，损失会突然变得很大，或者一直停在瞎猜的水平（五选一约 1.61）。",
            "健康的曲线：训练和验证都在进步，两条线差距不大。"][k];
  }
  $("cases").innerHTML = CASES.map(function (c, i) { return "<button>病例 " + (i + 1) + "</button>"; }).join("");
  document.querySelectorAll("#cases button").forEach(function (b, i) { b.onclick = function () { show(i); }; });
  show(0);
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
